<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>iGameVis 扁平图标预览</title>
<style>
  :root { --blue:#4C9BFF; --slate:#A9B7C9; }
  body { margin:0; padding:24px; background:#0E1116; color:#E8EEF7;
         font-family:"Microsoft YaHei UI","Segoe UI",sans-serif; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  p.sub { color:#8A99AC; font-size:12px; margin:0 0 18px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
  .card { border:1px solid #26303F; border-radius:10px; overflow:hidden; background:#141A24; }
  .card .name { font-size:11px; color:#9AA7B8; padding:6px 10px; border-bottom:1px solid #26303F;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row { display:flex; align-items:center; gap:14px; padding:10px; }
  .row.dark { background:#101722; }
  .row.light { background:#F1F3F7; border-top:1px solid #D3D9E2; }
  .row img { display:block; }
</style>
</head>
<body>
<h1>iGameVis · 扁平化图标集（2.5D 轻量）</h1>
<p class="sub">上排深色底、下排浅色底；每排依次 24 / 32 / 48 px。文件为 SVG，可直接用于 Qt 资源。</p>
<div class="grid" id="grid"></div>
<script>
const icons = ["Open","SaveFile","ScreenShot","animation_save_vcr","Delete","StreamTracer","Glyph",
"Deformation","Slice","Contourline","Chart","Chart-1","VolumeRendering","ScalarBar","BackGround",
"check","clear","refresh","Eyeball","EyeballClosed","IsometricView","orthographic",
"ShowOrientationAxes","ResetCenter","PickCenter","ShowCenterAxes","ResetScaleRange","SetScaleRange",
"youxuanzhuan90du","zuoxuanzhuan90du","+X","-X","+Y","-Y","+Z","-Z",
"VcrPlay","VcrPause","VcrReverse","VcrFirst","VcrLast","VcrBack","VcrForward","VcrLoop",
"VcrDisabledLoop","skip-previous","bbox","ContextPreservingAction","DragPoint","eye-open","eye-close",
"fill","hex","point","points","select_face","select_vertex_geodesic","selected","selectView","wireframe"];

const grid = document.getElementById('grid');
for (const name of icons) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="name" title="${name}">${name}</div>
    <div class="row dark">${[24,32,48].map(s=>`<img src="${name}.svg" width="${s}" height="${s}" alt="${name}">`).join('')}</div>
    <div class="row light">${[24,32,48].map(s=>`<img src="${name}.svg" width="${s}" height="${s}" alt="${name}">`).join('')}</div>`;
  grid.appendChild(card);
}
</script>
</body>
</html>
